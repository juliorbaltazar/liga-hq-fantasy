# Stack completa: SFU + entrada por OBS + emissor de tokens + HTTPS automático.
#
#   navegador  ──WebRTC──►  livekit  ◄──┐
#   OBS        ──WHIP────►  ingress ────┘  (ingress entra na sala como participante)
#
# Quem assiste não sabe qual veio de onde: os dois são "participante publicando vídeo".

services:
  # Fila de mensagens entre livekit e ingress. Obrigatório — o ingress não
  # conversa com o servidor sem ele.
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    restart: unless-stopped
    networks: [tela]

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    network_mode: host          # precisa da rede do host pro UDP do WebRTC funcionar
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on: [redis]

  ingress:
    image: livekit/ingress:latest
    restart: unless-stopped
    network_mode: host          # idem: ICE do WHIP precisa de UDP direto
    environment:
      INGRESS_CONFIG_FILE: /etc/ingress.yaml
    volumes:
      - ./ingress.yaml:/etc/ingress.yaml:ro
    depends_on: [redis, livekit]

  # Assina os tokens de entrada e cria os endereços de OBS.
  # A API secret vive aqui e nunca vai pro navegador.
  token:
    build: ./token-service
    restart: unless-stopped
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_HOST: ${LIVEKIT_HOST}
      ROOM_NAME: ${ROOM_NAME:-sala-principal}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
    ports:
      - "127.0.0.1:8090:8090"
    networks: [tela]
    depends_on: [livekit]

  # TLS automático via Let's Encrypt. OBS e navegador exigem HTTPS.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [livekit, ingress, token]

networks:
  tela:

volumes:
  caddy_data:
  caddy_config:
