# Recebe o OBS por WHIP e publica na sala como se fosse mais um participante.
logging:
  level: info

api_key: API_KEY_PLACEHOLDER
api_secret: API_SECRET_PLACEHOLDER

# Local: o ingress roda na mesma máquina que o livekit.
ws_url: ws://127.0.0.1:7880

redis:
  address: 127.0.0.1:6379

whip_port: 8080
rtmp_port: 1935        # sobra, caso alguém prefira RTMP em vez de WHIP
http_relay_port: 9090

# Passa o vídeo adiante sem recodificar. WHIP já chega em WebRTC, então
# transcodificar seria queimar CPU da VM à toa — e é justamente o que faria
# 4 cores ARM não darem conta.
rtc_config:
  udp_port: 7885
  use_external_ip: true
