name: Sleeper data snapshot

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC daily = 07:00 America/Sao_Paulo, 1h before the Liga HQ insights routine
  workflow_dispatch: {}     # allow manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch league state, rosters and users from Sleeper
        run: |
          LEAGUE_ID="1312228455764492288"
          curl -sf "https://api.sleeper.app/v1/state/nfl" -o /tmp/state.json
          curl -sf "https://api.sleeper.app/v1/league/${LEAGUE_ID}/rosters" -o /tmp/rosters.json
          curl -sf "https://api.sleeper.app/v1/league/${LEAGUE_ID}/users" -o /tmp/users.json

      - name: Fetch full player DB and trim to rostered players
        run: |
          curl -sf "https://api.sleeper.app/v1/players/nfl" -o /tmp/players_full.json
          python3 - <<'PYEOF'
          import json

          rosters = json.load(open("/tmp/rosters.json"))
          rostered_ids = set()
          for r in rosters:
              for pid in (r.get("players") or []):
                  rostered_ids.add(pid)

          players_full = json.load(open("/tmp/players_full.json"))
          trimmed = {}
          for pid in rostered_ids:
              p = players_full.get(pid)
              if not p:
                  continue
              trimmed[pid] = {
                  "n": p.get("full_name") or f"{p.get('first_name','')} {p.get('last_name','')}".strip() or pid,
                  "p": p.get("position"),
                  "tm": p.get("team"),
                  "ist": p.get("injury_status"),
                  "ibp": p.get("injury_body_part"),
                  "inote": p.get("injury_notes"),
                  "pp": p.get("practice_participation"),
                  "espn": p.get("espn_id"),
                  "num": p.get("number"),
                  "dc": p.get("depth_chart_order"),
              }
          json.dump(trimmed, open("/tmp/players_trimmed.json", "w"), ensure_ascii=False)
          print(f"Rostered players: {len(rostered_ids)}, trimmed entries written: {len(trimmed)}")
          PYEOF

      - name: Resolve target week (preseason analyses point at regular-season week 1)
        run: |
          python3 - <<'PYEOF'
          import json
          state = json.load(open("/tmp/state.json"))
          # During preseason the league doesn't score, so every analysis should aim at
          # regular-season week 1 — that's the first week that actually counts.
          if state["season_type"] == "regular":
              target = {"week": state["week"], "season_type": "regular"}
          else:
              target = {"week": 1, "season_type": "regular"}
          target["season"] = state["season"]
          json.dump(target, open("/tmp/target.json", "w"))
          print("target:", target)
          PYEOF

      - name: Fetch target-week league matchups
        run: |
          LEAGUE_ID="1312228455764492288"
          TW=$(python3 -c "import json;print(json.load(open('/tmp/target.json'))['week'])")
          curl -sf "https://api.sleeper.app/v1/league/${LEAGUE_ID}/matchups/${TW}" -o /tmp/matchups.json || echo "[]" > /tmp/matchups.json

      - name: Fetch NFL schedule for target week + full-season bye map
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request

          target = json.load(open("/tmp/target.json"))
          season, tweek = target["season"], target["week"]

          BASE = ("https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard"
                  "?dates={season}&seasontype=2&week={wk}")

          # ESPN and Sleeper disagree on a few abbreviations; normalize to Sleeper's so the
          # schedule keys line up with player teams and defense stats.
          ABBR = {"WSH": "WAS", "LA": "LAR", "JAC": "JAX"}
          def norm(a): return ABBR.get(a, a)

          def fetch_week(wk):
              with urllib.request.urlopen(BASE.format(season=season, wk=wk), timeout=30) as r:
                  return json.loads(r.read().decode())

          def games_of(data):
              out = {}
              for ev in data.get("events", []):
                  comp = (ev.get("competitions") or [{}])[0]
                  teams = comp.get("competitors", [])
                  if len(teams) != 2:
                      continue
                  home = next((t for t in teams if t.get("homeAway") == "home"), None)
                  away = next((t for t in teams if t.get("homeAway") == "away"), None)
                  if not home or not away:
                      continue
                  h = norm((home.get("team") or {}).get("abbreviation"))
                  a = norm((away.get("team") or {}).get("abbreviation"))
                  if not h or not a:
                      continue
                  out[h] = {"opp": a, "home": True, "kickoff": ev.get("date")}
                  out[a] = {"opp": h, "home": False, "kickoff": ev.get("date")}
              return out

          schedule = {}
          try:
              schedule = games_of(fetch_week(tweek))
              print(f"Target-week ({tweek}) schedule entries: {len(schedule)}")
          except Exception as e:
              print(f"Target-week schedule fetch failed ({e})")

          # Walk the whole regular season to find each team's bye week (the week they don't appear).
          # 2026 regular season runs 18 weeks; teams play 17 games, so exactly one week is a bye.
          byes, weeks_seen = {}, 0
          all_teams = set()
          played = {}
          try:
              for wk in range(1, 19):
                  g = games_of(fetch_week(wk))
                  if not g:
                      continue
                  weeks_seen += 1
                  all_teams.update(g.keys())
                  for t in g:
                      played.setdefault(t, set()).add(wk)
              for t in all_teams:
                  missing = [w for w in range(1, weeks_seen + 1) if w not in played.get(t, set())]
                  if len(missing) == 1:
                      byes[t] = missing[0]
                  elif missing:
                      byes[t] = missing[0]
              print(f"Bye weeks resolved for {len(byes)} teams across {weeks_seen} weeks")
          except Exception as e:
              print(f"Bye map build failed ({e}) — continuing without it.")

          json.dump(schedule, open("/tmp/schedule.json", "w"))
          json.dump(byes, open("/tmp/byes.json", "w"))
          PYEOF

      - name: Compute defense fantasy-points-allowed by position
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request

          state = json.load(open("/tmp/state.json"))
          season, week, stype = state["season"], state["week"], state["season_type"]
          prev = state.get("previous_season")

          POS_KEYS = ["qb", "rb", "wr", "te", "k"]

          def collect(season_year, season_type, weeks):
              """Average fan_pts_allow_* per defense across the given weeks."""
              totals = {}
              sampled = 0
              for w in weeks:
                  url = f"https://api.sleeper.app/v1/stats/nfl/{season_type}/{season_year}/{w}"
                  try:
                      with urllib.request.urlopen(url, timeout=60) as r:
                          wk = json.loads(r.read().decode())
                  except Exception as e:
                      print(f"  {season_year} {season_type} wk{w} failed: {e}")
                      continue
                  got = False
                  for pid, s in (wk or {}).items():
                      if not isinstance(s, dict):
                          continue
                      # DEF rows are keyed by team abbreviation (e.g. "PIT")
                      if not (pid.isalpha() and pid.isupper() and 2 <= len(pid) <= 3):
                          continue
                      if not any(f"fan_pts_allow_{p}" in s for p in POS_KEYS):
                          continue
                      got = True
                      bucket = totals.setdefault(pid, {p: [] for p in POS_KEYS})
                      for p in POS_KEYS:
                          v = s.get(f"fan_pts_allow_{p}")
                          if v is not None:
                              bucket[p].append(float(v))
                  if got:
                      sampled += 1
              avg = {t: {p: (round(sum(v)/len(v), 2) if v else None) for p, v in b.items()}
                     for t, b in totals.items()}
              return avg, sampled

          # A single preseason game (backups on the field) is noise. Until the current regular
          # season has enough weeks of its own, base matchup difficulty on LAST season's full
          # 18 weeks — a real signal for planning week 1.
          cur_weeks = list(range(1, week + 1)) if stype == "regular" else []
          cur_avg, cur_n = collect(season, "regular", cur_weeks) if cur_weeks else ({}, 0)

          prev_avg, prev_n = ({}, 0)
          if prev and cur_n < 4:
              prev_avg, prev_n = collect(prev, "regular", list(range(1, 19)))

          if cur_n >= 4:
              avg, basis, sampled = cur_avg, f"temporada {season} (semanas 1-{week})", cur_n
          elif prev_n:
              avg, basis, sampled = prev_avg, f"temporada {prev} completa", prev_n
          else:
              avg, basis, sampled = cur_avg, f"temporada {season} (amostra mínima)", cur_n

          ranks = {}
          for p in POS_KEYS:
              vals = [(t, a[p]) for t, a in avg.items() if a.get(p) is not None]
              vals.sort(key=lambda x: x[1], reverse=True)
              for i, (t, _) in enumerate(vals, start=1):
                  ranks.setdefault(t, {})[p] = i

          out = {
              "weeks_sampled": sampled,
              "basis": basis,
              "avg_fpts_allowed": avg,
              "rank_easiest_first": ranks,
              "_note": "rank 1 = defesa que mais cede pontos fantasy nessa posição (matchup mais fácil)",
          }
          json.dump(out, open("/tmp/def_vs_pos.json", "w"))
          print(f"Defenses profiled: {len(avg)} | basis: {basis} ({sampled} semanas)")
          PYEOF

      - name: Compute per-player recent usage trend
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request

          state = json.load(open("/tmp/state.json"))
          season = state["season"]
          week = state["week"]
          stype = state["season_type"]
          players = json.load(open("/tmp/players_trimmed.json"))

          KEEP = ["pts_ppr", "rec_tgt", "rec", "rec_yd", "rush_att", "rush_yd",
                  "off_snp", "tm_off_snp", "pass_att", "pass_yd", "pass_td",
                  "rec_td", "rush_td", "rec_rz_tgt", "rush_rz_att"]

          usage = {}   # pid -> [{week, ...stats}]
          for w in range(1, max(week, 1) + 1):
              url = f"https://api.sleeper.app/v1/stats/nfl/{stype}/{season}/{w}"
              try:
                  with urllib.request.urlopen(url, timeout=60) as r:
                      wk = json.loads(r.read().decode())
              except Exception as e:
                  print(f"week {w} stats fetch failed: {e}")
                  continue
              for pid in players:
                  s = (wk or {}).get(pid)
                  if not isinstance(s, dict):
                      continue
                  row = {"week": w}
                  for k in KEEP:
                      if s.get(k) is not None:
                          row[k] = s[k]
                  snp, tm = s.get("off_snp"), s.get("tm_off_snp")
                  if snp is not None and tm:
                      row["snap_pct"] = round(100 * float(snp) / float(tm))
                  if len(row) > 1:
                      usage.setdefault(pid, []).append(row)

          json.dump(usage, open("/tmp/usage.json", "w"))
          print(f"Players with usage rows: {len(usage)}")
          PYEOF

      - name: Fetch Sleeper projections for the current week
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request

          state = json.load(open("/tmp/state.json"))
          season, week, stype = state["season"], state["week"], state["season_type"]
          players = json.load(open("/tmp/players_trimmed.json"))

          KEEP = ["pts_ppr", "pts_half_ppr", "rec", "rec_tgt", "rec_yd", "rec_td",
                  "rush_att", "rush_yd", "rush_td", "pass_yd", "pass_td", "pass_int",
                  "adp_dd_ppr", "pos_adp_dd_ppr", "gp"]

          url = f"https://api.sleeper.app/v1/projections/nfl/{stype}/{season}/{week}"
          proj = {}
          try:
              with urllib.request.urlopen(url, timeout=60) as r:
                  raw = json.loads(r.read().decode())
              for pid in players:
                  s = (raw or {}).get(pid)
                  if not isinstance(s, dict):
                      continue
                  row = {k: s[k] for k in KEEP if s.get(k) is not None}
                  if row:
                      proj[pid] = row
              print(f"Projections captured: {len(proj)}")
          except Exception as e:
              print(f"Projection fetch failed ({e}) — continuing without it.")

          json.dump(proj, open("/tmp/projections.json", "w"))
          PYEOF

      - name: Fetch previous-season per-player baseline (full-season context)
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request

          state = json.load(open("/tmp/state.json"))
          prev = state.get("previous_season")
          players = json.load(open("/tmp/players_trimmed.json"))

          baseline = {}
          if prev:
              url = f"https://api.sleeper.app/v1/stats/nfl/regular/{prev}"
              try:
                  with urllib.request.urlopen(url, timeout=90) as r:
                      raw = json.loads(r.read().decode())
                  KEEP = ["gp", "gs", "pts_ppr", "rec", "rec_tgt", "rec_yd", "rec_td",
                          "rush_att", "rush_yd", "rush_td", "pass_yd", "pass_td",
                          "off_snp", "tm_off_snp", "pos_rank_ppr"]
                  for pid in players:
                      s = (raw or {}).get(pid)
                      if not isinstance(s, dict):
                          continue
                      row = {k: s[k] for k in KEEP if s.get(k) is not None}
                      gp = row.get("gp")
                      if gp:
                          for per in ("pts_ppr", "rec_tgt", "rush_att"):
                              if row.get(per) is not None:
                                  row[f"{per}_per_game"] = round(float(row[per]) / float(gp), 2)
                      if row:
                          baseline[pid] = row
                  print(f"Baseline ({prev}) captured: {len(baseline)}")
              except Exception as e:
                  print(f"Baseline fetch failed ({e}) — continuing without it.")

          json.dump(baseline, open("/tmp/baseline.json", "w"))
          PYEOF

      - name: Assemble snapshot file
        run: |
          mkdir -p liga-hq
          python3 - <<'PYEOF'
          import json
          from datetime import datetime, timezone

          def load(path, default):
              try:
                  return json.load(open(path))
              except Exception:
                  return default

          state = json.load(open("/tmp/state.json"))
          rosters = json.load(open("/tmp/rosters.json"))
          users = json.load(open("/tmp/users.json"))
          players = json.load(open("/tmp/players_trimmed.json"))
          matchups = load("/tmp/matchups.json", [])
          schedule = load("/tmp/schedule.json", {})
          def_vs_pos = load("/tmp/def_vs_pos.json", {})
          usage = load("/tmp/usage.json", {})
          projections = load("/tmp/projections.json", {})
          baseline = load("/tmp/baseline.json", {})
          target = load("/tmp/target.json", {})
          byes = load("/tmp/byes.json", {})

          snapshot = {
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "nfl_state": state,
              "target": target,
              "rosters": rosters,
              "users": users,
              "players": players,
              "matchups": matchups,
              "nfl_schedule": schedule,
              "bye_weeks": byes,
              "def_vs_pos": def_vs_pos,
              "usage": usage,
              "projections": projections,
              "prev_season_baseline": baseline,
          }
          json.dump(snapshot, open("liga-hq/sleeper-snapshot.json", "w"), ensure_ascii=False, indent=0)
          print("snapshot written")
          PYEOF

      - name: Commit snapshot if changed
        run: |
          git config user.name "sleeper-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add liga-hq/sleeper-snapshot.json
          if git diff --cached --quiet; then
            echo "No changes to snapshot, skipping commit."
          else
            git commit -m "Snapshot: dados do Sleeper $(date -u +%Y-%m-%d)"
            git push
          fi
