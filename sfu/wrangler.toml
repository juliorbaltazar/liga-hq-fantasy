name = "tela-sfu"
main = "worker.js"
compatibility_date = "2026-01-01"

# SFU_APP_ID nao e segredo (aparece na URL da API), entao pode ficar aqui.
# SFU_APP_TOKEN e ROOM_KEY sao segredos -> use `wrangler secret put`.
[vars]
SFU_APP_ID = "COLE_SEU_APP_ID_AQUI"

# Depois que o app estiver publicado, troque "*" pela origem real da pagina
# (ex: "https://seuusuario.github.io") pra ninguem mais usar sua cota.
# ALLOWED_ORIGIN = "*"
